services:
  chat-integration:
    build: .
    restart: unless-stopped
    env_file:
      - bot/.env
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${PORT:-8787}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
